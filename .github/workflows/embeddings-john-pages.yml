name: Deploy embeddings learning lab
on:
  push:
    branches: [main]
    paths:
      - 'demos/embeddings-john/vite/**'
      - '.github/workflows/embeddings-john-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: embeddings-learning-lab-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: demos/embeddings-john/vite
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: demos/embeddings-john/vite
        run: npm test
      - name: Build frontend
        working-directory: demos/embeddings-john/vite
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demos/embeddings-john/vite/dist
      - id: deployment
        uses: actions/deploy-pages@v4
