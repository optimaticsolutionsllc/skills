<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#FAF9F5"/><meta name="description" content="A hands-on interactive guide to embeddings for Rose and Tim, built around John J D Munn's content workflow."/><title>Embeddings by Doing | Happier Work Learning Lab</title><script>(function(){try{var t=localStorage.getItem('embeddings-by-doing-theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.dataset.theme='light';}})();</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
